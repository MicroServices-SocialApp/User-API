name: Notify Parent Repo
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send Repository Dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_TOKEN_FOR_ALL_MICROSERVICES }}
          repository: your-username/All_MS_Instagram
          event-type: microservice_updated
